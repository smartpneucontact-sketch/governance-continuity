{% extends 'base.html' %}
{% block title %}{{ 'Edit' if leader else 'Add' }} Leader — Governance Continuity{% endblock %}
{% block content %}
<div class="page-header">
    <h1>{{ 'Edit' if leader else 'Add' }} Leader</h1>
</div>

<div class="card form-card">
    <form method="POST">
        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" name="name" id="name" required value="{{ leader.name if leader else '' }}">
        </div>
        <div class="grid-2">
            <div class="form-group">
                <label for="title">Title / Role</label>
                <input type="text" name="title" id="title" required value="{{ leader.title if leader else '' }}" placeholder="e.g. VP of Engineering">
            </div>
            <div class="form-group">
                <label for="department">Department</label>
                <input type="text" name="department" id="department" required value="{{ leader.department if leader else '' }}" placeholder="e.g. Engineering">
            </div>
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" name="email" id="email" value="{{ leader.email if leader and leader.email else '' }}" placeholder="name@company.com">
        </div>
        <div class="form-group">
            <label for="successor_id">Designated Successor</label>
            <select name="successor_id" id="successor_id">
                <option value="">— No successor designated —</option>
                {% for l in all_leaders %}
                <option value="{{ l.id }}" {{ 'selected' if leader and leader.successor_id == l.id }}>{{ l.name }} — {{ l.title }}</option>
                {% endfor %}
            </select>
        </div>
        {% if leader %}
        <div class="form-group">
            <label for="notes">Notes</label>
            <textarea name="notes" id="notes" placeholder="Any relevant context...">{{ leader.notes or '' }}</textarea>
        </div>
        {% endif %}
        <div class="btn-group">
            <button type="submit" class="btn btn-primary">{{ 'Save Changes' if leader else 'Add Leader' }}</button>
            <a href="{{ url_for('leaders_list') }}" class="btn btn-outline">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
