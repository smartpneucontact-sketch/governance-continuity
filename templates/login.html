{% extends 'base.html' %}
{% block title %}Sign In — GCA{% endblock %}
{% block content %}
<div style="max-width: 400px; margin: 4rem auto;">
    <div style="text-align: center; margin-bottom: 2rem;">
        <div style="font-family: 'Space Mono', monospace; font-size: 0.72rem; letter-spacing: 0.15em; color: var(--accent); margin-bottom: 1rem;">GOVERNANCE CONTINUITY ARCHITECTURE</div>
        <h1 style="font-size: 1.5rem;">Sign In</h1>
    </div>
    <div class="card">
        <form method="POST">
            <div class="form-group"><label for="email">Email</label><input type="email" name="email" id="email" required placeholder="you@company.com"></div>
            <div class="form-group"><label for="password">Password</label><input type="password" name="password" id="password" required></div>
            <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">Sign In</button>
        </form>
    </div>
    <p style="text-align: center; margin-top: 1rem; font-size: 0.82rem; color: var(--text-muted);">No account? <a href="{{ url_for('register') }}">Create one</a></p>
</div>
{% endblock %}
