{% extends 'base.html' %}
{% block title %}Create Account — Governance Continuity{% endblock %}
{% block content %}
<div style="max-width: 400px; margin: 4rem auto;">
    <div style="text-align: center; margin-bottom: 2rem;">
        <div style="font-family: 'Space Mono', monospace; font-size: 0.75rem; letter-spacing: 0.15em; color: var(--accent); margin-bottom: 1rem;">GOVERNANCE CONTINUITY</div>
        <h1 style="font-size: 1.5rem;">Create Account</h1>
    </div>
    <div class="card">
        <form method="POST">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" name="name" id="name" required placeholder="Jane Smith">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" name="email" id="email" required placeholder="you@company.com">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" name="password" id="password" required minlength="6">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">Create Account</button>
        </form>
    </div>
    <p style="text-align: center; margin-top: 1rem; font-size: 0.82rem; color: var(--text-muted);">
        Already have an account? <a href="{{ url_for('login') }}">Sign in</a>
    </p>
</div>
{% endblock %}
